<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Спасибо за заявку — НАРИТ</title>
<link rel="icon" type="image/png" href="/img/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto',sans-serif;background:#f8f9fa;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:56px 48px;max-width:520px;width:100%;text-align:center}
.icon{width:72px;height:72px;border-radius:50%;background:#1929B3;display:flex;align-items:center;justify-content:center;margin:0 auto 28px}
.icon svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:#1929B3;margin-bottom:16px}
p{font-size:16px;line-height:1.7;color:#555;margin-bottom:8px}
.back{display:inline-block;margin-top:32px;padding:14px 36px;background:#FF0007;color:#fff;font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;text-decoration:none;border-radius:6px}
.back:hover{background:#cc0005}
.call{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:14px 36px;background:#fff;color:#1929B3;font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;text-decoration:none;border-radius:6px;border:2px solid #1929B3}
.call:hover{background:#f0f2ff}
.btns{display:flex;flex-direction:column;align-items:center;gap:0}
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1>Заявка принята!</h1>
  <p>Спасибо за обращение. Наш специалист свяжется с вами в ближайшее время.</p>
  <p>Мы перезвоним в рабочее время: пн–пт, 9:00–18:00 (МСК).</p>
  <div class="btns">
    <a href="tel:+78003029585" class="call">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6.18 6.18l.98-.98a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Позвонить бесплатно
    </a>
    <small style="font-size:13px;color:#aaa;margin:6px 0 0">8 (800) 302-95-85 — звонок бесплатный</small>
    <a href="/" class="back">Вернуться на главную</a>
  </div>
</div>
</body>
</html>
